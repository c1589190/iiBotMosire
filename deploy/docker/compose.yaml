name: hermes-iibot

services:
  hermes-iibot:
    build:
      context: .
      args:
        HERMES_BASE: ${HERMES_BASE:-ghcr.io/nousresearch/hermes-agent:main}
        IIBOT_VERSION: ${IIBOT_VERSION:-Alpha20261103}
        IIBOT_SHA256: ${IIBOT_SHA256:-a362b0e5475ff345e45dca1f3b001875d1377b0203c67e0fc62b3bc181c8ded6}
        PLUGINS_REF: ${PLUGINS_REF:-v0.2.6}
    image: hermes-iibot:${IIBOT_VERSION:-Alpha20261103}-plugins-${PLUGINS_REF:-v0.2.6}
    env_file:
      - .env
    volumes:
      # iiBot 状态：bot.json / bot.db / inbox（含每次启动重签的 token）/ media / logs
      - iibot-data:/opt/iibot/data
      # Hermes 状态：config.yaml / plugins / sessions / plugin-data / logs / auth.json
      - hermes-state:/opt/data
    ports:
      # 只想在本机看通知板才需要；业务工具面 8765 一律不对外
      - "127.0.0.1:46500:46500"
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:46500/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

volumes:
  iibot-data:
  hermes-state:
