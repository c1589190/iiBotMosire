# DSH profile overlay: connect this DSH Agent to iiBotMosire's control MCP.
# Usage:
#   export IIBOT_CONTROL_TOKEN='...'
#   dsh --profile headless --patch /home/cna/iiBotMosire/simulation/dsh/cordis.patch.yml \
#       "$(cat /home/cna/iiBotMosire/simulation/dsh/GM_SYSTEM_PROMPT.md)"
- insert:
    - id: mcp-iibot-control
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: iibot
        transport: streamable-http
        url: http://127.0.0.1:8765/mcp/control
        headers:
          Authorization: !!js '`Bearer ${process.env.IIBOT_CONTROL_TOKEN}`'
        # Inbox Mode A 不使用长轮询；普通工具调用 60 秒超时。
        toolCallTimeoutMs: 60000
        failOnStartupError: true
